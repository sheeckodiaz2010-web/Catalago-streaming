<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda Streaming</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f3ff;--card:#fff;--tx:#1b1535;--mu:#6b6590;--ac:#6d4ee8;--ac2:#8b5cf6;--ok:#16a34a;--no:#dc2626;--bd:#e2ddf7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d1c;--card:#1a1730;--tx:#f0edff;--mu:#9a94c4;--bd:#2c2850;--ac:#7c5cf0}}
:root[data-theme="dark"]{--bg:#0f0d1c;--card:#1a1730;--tx:#f0edff;--mu:#9a94c4;--bd:#2c2850;--ac:#7c5cf0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;padding-bottom:90px}
header{padding:20px 16px 8px}h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mu);font-size:14px}
#q{width:calc(100% - 32px);margin:10px 16px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
@media(min-width:700px){#grid{grid-template-columns:repeat(4,1fr)}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.logo{height:70px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:17px;text-align:center}
.c h3{margin:6px 0 0;font-size:16px}.dur{display:inline-block;background:var(--ac);color:#fff;border-radius:999px;font-size:12px;padding:3px 10px;width:max-content}
.p{font-size:24px;font-weight:bold;color:var(--ac)}.s{font-size:13px}.ok{color:var(--ok)}.no{color:var(--no)}
.q{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:12px;padding:2px}
.q button{background:none;border:0;color:var(--tx);font-size:20px;width:36px;height:34px}
.add{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:bold}
.add:disabled{opacity:.4}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:bold;display:none;justify-content:space-between}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:5}
#box{background:var(--card);width:100%;max-height:85%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.r{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.r button{background:none;border:0;color:var(--no);font-size:13px}
#nm{width:100%;padding:12px;margin:12px 0;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.go{width:100%;background:#25d366;color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:bold}
.x{background:none;border:0;color:var(--mu);width:100%;padding:12px;font-size:14px}
small.n{display:block;color:var(--mu);text-align:center;padding:16px;font-size:12px}
#adm{margin-top:10px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:13px}
#ed{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
#edb{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#edb label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
#edb select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
#edb input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.er{border:1px solid var(--bd);border-radius:14px;padding:10px;margin:10px 0}
.er .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.er input[type=color]{padding:2px;height:42px}
.dl{background:none;border:0;color:var(--no);font-size:13px;padding:6px 0}
.sec{background:var(--bg);color:var(--tx);border:1px dashed var(--ac);border-radius:12px;padding:12px;width:100%;margin:6px 0;font-size:14px}
.tb{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:14px;font-weight:bold}
.tb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#tabs{display:flex;gap:8px;padding:6px 16px}
.hid{display:none}
#rf{padding:0 16px}#rf label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
#rf input,#rf select,#rf textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
#rf .go{margin-top:18px}.n2{color:var(--mu);font-size:12px;margin-top:10px}
#lg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#lg.hid{display:none}#lgb{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:360px}
#lgb input{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
#out{display:none;margin-left:8px;background:none;border:0;color:var(--mu);font-size:13px}
.pl{font-size:12px;color:var(--mu);margin:14px 0 2px}.pv{font-size:17px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cpy{background:var(--bg);color:var(--ac);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:bold}
#cf{width:100%;padding:12px;border:1px dashed var(--ac);border-radius:12px;background:var(--bg);color:var(--tx);font-size:14px}
.warn{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:13px;margin-top:10px}
.q2{display:flex;align-items:center;gap:6px}.q2 button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;width:36px;height:36px;font-size:18px}.q2 b{min-width:20px;text-align:center}
.rvp body>*{display:none!important}.rvp #rcv,.rvp #rcv.hid{display:block!important}
#rpb{margin-top:10px;margin-left:6px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:13px}
</style></head><body>
<header><h1 id="ttl"></h1><p>Elige tu plataforma, agrega al carrito y pide por WhatsApp.</p><button id="adm" style="display:none" onclick="openEd()">⚙️ Editar tienda</button><button id="rpb" style="display:none">📋 Reportes</button><button id="out">Salir</button></header>
<div id="tabs"><button id="t1" class="tb on" onclick="tab(1)">🛒 Comprar</button><button id="t2" class="tb" onclick="tab(2)">🛠 Reportar problema</button></div>
<div id="shop"><input id="q" placeholder="🔍 Buscar plataforma..." oninput="draw()">
<div id="grid"></div>
<small class="n">Entrega por WhatsApp una vez confirmado tu pago. Precio por perfil, 1 mes.</small>
</div>
<div id="rep" class="hid"><h2 style="margin:6px 16px">Reportar un problema</h2><div id="rf">
<label>Tu nombre</label><input id="rn" placeholder="Nombre">
<label>Plataforma</label><select id="rp"></select>
<label>Perfil</label><input id="rpf" placeholder="Ej. P3 o nombre del perfil">
<label>Correo de la cuenta</label><input id="rc" type="email" placeholder="El correo de tu cuenta de streaming">
<label>Descripción del problema</label><textarea id="rd" rows="4" placeholder="Cuéntanos qué pasa (no entra, pide código, clave incorrecta...)"></textarea>
<label>Foto (opcional)</label><input id="rph" type="file" accept="image/*">
<button class="go" onclick="sendRep()">Enviar reporte por WhatsApp</button><div id="rm" class="n2"></div></div></div>
<button id="bar" onclick="openCart()"><span id="bn">🛒 Ver carrito</span><span id="bt"></span></button>
<div id="sheet" onclick="if(event.target===this)closeCart()"><div id="box"></div></div>
<script type="application/json" id="data">{"title":"🎬 Tienda Streaming","whatsapp":"528611261265","pay":{"titular":"SERGIO DIAZ RODRIGUEZ","cards":[{"b":"BBVA Bancomer","n":"4152314111314210"},{"b":"Nu","n":"5101252636480883"}]},"platforms":[{"n":"Netflix","dur":"1 Mes","price":100,"stock":3,"c":"#e50914"},{"n":"Disney+","dur":"1 Mes","price":80,"stock":4,"c":"#113ccf"},{"n":"HBO Max","dur":"1 Mes","price":70,"stock":4,"c":"#5b2bd9"},{"n":"Amazon Prime","dur":"1 Mes","price":50,"stock":5,"c":"#1a98ff"},{"n":"Paramount+","dur":"1 Mes","price":50,"stock":1,"c":"#0064ff"},{"n":"VIX+","dur":"1 Mes","price":50,"stock":8,"c":"#f26a00"},{"n":"Crunchyroll","dur":"1 Mes","price":50,"stock":1,"c":"#f47521"},{"n":"Spotify por pedido","dur":"1 Mes","price":80,"stock":0,"c":"#1db954"}]}</script>
<div id="lg" class="hid"><div id="lgb"><h3 style="margin:0 0 6px">Acceso administrador</h3>
<input id="le" type="email" placeholder="Correo" autocomplete="username"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password">
<button class="go" id="lb">Entrar</button><div id="lm" style="color:var(--no);font-size:13px;margin-top:8px"></div><button class="x" id="lc">Cancelar</button></div></div>
<div id="rcv" class="hid" style="position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:30;overflow:auto;padding:16px"><div id="rcvb" style="background:var(--card);border-radius:16px;padding:16px;max-width:480px;margin:0 auto"></div></div>
<div id="rpt" class="hid" style="position:fixed;inset:0;background:var(--bg);z-index:25;overflow:auto;padding:14px"><div id="rptb" style="max-width:560px;margin:0 auto"></div></div>
<div id="ed"><div id="edb"></div></div>
<script>
if(/^#[cf]=/.test(location.hash))document.documentElement.className="rvp";
var D=JSON.parse(document.getElementById("data").textContent),P=D.platforms;
var cart={},qty={};
function money(x){return "$"+x.toFixed(2)}
function draw(){
 var t=document.getElementById("q").value.toLowerCase(),h="";
 P.forEach(function(p,i){
  if(p.n.toLowerCase().indexOf(t)<0)return;
  var q=qty[i]||1,out=p.stock<=0;
  h+='<div class="c"><div class="logo" style="background:'+p.c+'">'+p.n+'</div><h3>'+p.n+'</h3><span class="dur">'+(p.dur||"1 Mes")+'</span>'+
  '<div class="p">'+money(p.price)+'</div><div class="s '+(out?'no':'ok')+'">● '+(out?'Agotado':'Disponible')+'</div>'+
  (out?'':'<div class="q"><button onclick="ch('+i+',-1)">−</button><b>'+q+'</b><button onclick="ch('+i+',1)">+</button></div>')+
  '<button class="add" '+(out?'disabled':'')+' onclick="add('+i+')">🛒 Agregar</button></div>';
 });
 document.getElementById("grid").innerHTML=h||'<p style="grid-column:1/-1;color:var(--mu)">Sin resultados.</p>';
}
function ch(i,d){var v=(qty[i]||1)+d;qty[i]=Math.max(1,Math.min(5,v));draw()}
function add(i){cart[i]=Math.min(5,(cart[i]||0)+(qty[i]||1));qty[i]=1;draw();bar()}
function total(){var t=0,n=0;for(var k in cart){t+=cart[k]*P[k].price;n+=cart[k]}return [t,n]}
function bar(){var r=total(),b=document.getElementById("bar");b.style.display=r[1]?"flex":"none";
 document.getElementById("bn").textContent="🛒 Ver carrito ("+r[1]+")";document.getElementById("bt").textContent=money(r[0])}
function openCart(){
 var h='<h2 style="margin:0 0 6px">Tu pedido</h2>';
 for(var k in cart)h+='<div class="r"><span><b>'+P[k].n+'</b><br>'+money(cart[k]*P[k].price)+'</span><div class="q2"><button onclick="cq('+k+',-1)">−</button><b>'+cart[k]+'</b><button onclick="cq('+k+',1)">+</button><button class="dl" onclick="rm('+k+')">🗑</button></div></div>';
 h+='<div class="r"><b>Total</b><b>'+money(total()[0])+'</b></div><input id="nm" placeholder="Tu nombre" value="'+esc(window.CN||"")+'"><div id="cm" style="color:var(--no);font-size:13px"></div><button class="go" style="background:var(--ac)" onclick="goPay()">Continuar al pago</button><button class="x" onclick="closeCart()">Seguir viendo</button>';
 document.getElementById("box").innerHTML=h;document.getElementById("sheet").style.display="flex"}
function closeCart(){document.getElementById("sheet").style.display="none"}
function saveNm(){var e=document.getElementById("nm");if(e)window.CN=e.value}
function cq(k,d){saveNm();var v=(cart[k]||0)+d;if(v<=0)delete cart[k];else cart[k]=Math.min(5,v);bar();if(total()[1])openCart();else closeCart()}
function rm(k){saveNm();delete cart[k];bar();if(total()[1])openCart();else closeCart()}
function doneMsg(){cart={};bar();document.getElementById("box").innerHTML='<h2 style="margin:0 0 8px">✅ Pedido enviado</h2><p style="font-size:14px;color:var(--mu)">Se abrió WhatsApp con tu pedido y tu comprobante. En cuanto confirmemos tu pago te entregamos tu cuenta.</p><button class="go" style="background:var(--ac)" onclick="closeCart();draw()">Volver a la tienda</button>'}
function fmtCard(n){return String(n).replace(/\D/g,"").replace(/(\d{4})(?=\d)/g,"$1 ")}
document.addEventListener("click",function(e){var b=e.target;if(!b.classList||!b.classList.contains("cpy"))return;
 var t=b.getAttribute("data-v"),ok=function(){b.textContent="¡Copiado!";setTimeout(function(){b.textContent="Copiar"},1500)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){fb()});else fb();
 function fb(){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy")}catch(_){}x.remove();ok()}});
function goPay(){
 var nm=(document.getElementById("nm").value||"").trim();
 if(!nm){document.getElementById("cm").textContent="Escribe tu nombre para continuar.";return}
 window.CN=nm;var pay=D.pay||{titular:"",cards:[]};
 var h='<h2 style="margin:0 0 6px">Pago por transferencia o depósito</h2><div class="r"><b>Total a pagar</b><b>'+money(total()[0])+'</b></div>'+
 '<div class="pl">Nombre</div><div class="pv">'+esc(pay.titular)+'</div>';
 (pay.cards||[]).forEach(function(c){if(!c.n)return;h+='<div class="pl">Tarjeta '+esc(c.b)+'</div><div class="pv"><span>'+fmtCard(c.n)+'</span><button class="cpy" data-v="'+esc(String(c.n).replace(/\D/g,""))+'">Copiar</button></div>'});
 h+='<div class="pl">Concepto (tu nombre)</div><div class="pv"><span>'+esc(nm)+'</span><button class="cpy" data-v="'+esc(nm)+'">Copiar</button></div>'+
 '<div class="pl">WhatsApp para enviar tu comprobante</div><div class="pv"><span>+'+esc(D.whatsapp)+'</span><button class="cpy" data-v="'+esc(D.whatsapp)+'">Copiar</button></div>'+
 '<div class="warn">Primero haz tu depósito o transferencia. Después agrega la captura de tu comprobante para poder enviar el pedido.</div>'+
 '<div class="pl">Comprobante de pago *</div><input id="cf" type="file" accept="image/*"><div id="pm" style="color:var(--no);font-size:13px;margin:8px 0"></div>'+
 '<button class="go" onclick="sendOrder()">Enviar pedido y comprobante por WhatsApp</button><button class="x" onclick="openCart()">← Volver al pedido</button>';
 document.getElementById("box").innerHTML=h}
function compress(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);
 im.onload=function(){var k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);var q=.7,d=c.toDataURL("image/jpeg",q);
  while(d.length>800000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}
  URL.revokeObjectURL(u);d.length>800000?rej():res(d)};im.onerror=rej;im.src=u})}
var CLD={cloud:"",preset:""}; // Cloudinary: tu "Cloud name" y el nombre del "upload preset" (unsigned)
function compressBlob(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);
 im.onload=function(){var k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej({message:"imagen"})},"image/jpeg",.8)};
 im.onerror=function(){rej({message:"imagen"})};im.src=u})}
async function upCld(blob){var fd=new FormData();fd.append("file",blob,"comprobante.jpg");fd.append("upload_preset",CLD.preset);fd.append("folder","comprobantes");
 var r=await fetch("https://api.cloudinary.com/v1_1/"+CLD.cloud+"/image/upload",{method:"POST",body:fd});
 var j=await r.json();if(!r.ok||!j.secure_url)throw {message:(j.error&&j.error.message)||"error de subida"};return j.secure_url}
async function sendOrder(){
 var f=document.getElementById("cf").files[0],pm=document.getElementById("pm");
 if(!f){pm.textContent="Primero deposita y agrega la captura de tu comprobante.";return}
 if(f.type.indexOf("image/")!==0){pm.textContent="El comprobante debe ser una imagen.";return}
 var W=null;try{W=window.open("","_blank")}catch(e){}
 function openWA(u){if(W&&!W.closed){W.location.href=u;doneMsg()}else{window.location.href=u}}
 var m="Hola! Hice mi pago y quiero mi pedido.\n\n👤 Nombre: "+window.CN+"\n🛒 Pedido:\n";
 for(var k in cart)m+="• "+cart[k]+" x "+P[k].n+" ("+(P[k].dur||"1 Mes")+") – "+money(cart[k]*P[k].price)+"\n";
 m+="\n💰 Total pagado: "+money(total()[0]);
 if(CLD.cloud&&CLD.preset){
  try{
   pm.style.color="var(--mu)";pm.textContent="Subiendo comprobante...";
   var blob=await compressBlob(f);
   var url=await Promise.race([upCld(blob),new Promise(function(_,rj){setTimeout(function(){rj({message:"tiempo agotado"})},15000)})]);
   openWA("https://wa.me/"+D.whatsapp+"?text="+encodeURIComponent(m+"\n\n📎 Comprobante: "+url));return
  }catch(e){pm.style.color="var(--no)";pm.textContent="No se pudo subir ("+(e&&(e.message||e.code)||"error")+"). Probando otra forma..."}}
 if(window.FB_ORDER){
  try{
   pm.style.color="var(--mu)";pm.textContent="Preparando comprobante...";
   var img=await compress(f),it="";for(var k2 in cart)it+=cart[k2]+" x "+P[k2].n+"\n";
   pm.textContent="Subiendo comprobante...";
   var id=await Promise.race([window.FB_ORDER({nombre:String(window.CN).slice(0,70),total:money(total()[0]),items:it,img:img}),new Promise(function(_,rj){setTimeout(function(){rj({code:"tiempo agotado"})},12000)})]);
   var link=location.href.split("#")[0]+"#c="+id;
   openWA("https://wa.me/"+D.whatsapp+"?text="+encodeURIComponent(m+"\n\n📎 Comprobante: "+link));return
  }catch(e){pm.style.color="var(--no)";pm.textContent="No se pudo subir ("+(e&&(e.code||e.message)||"error")+"). Usando otra forma..."}}
 if(navigator.canShare&&navigator.canShare({files:[f]})){
  try{await navigator.share({text:m,files:[f]});if(W)W.close();pm.style.color="var(--ok)";pm.textContent="Elige WhatsApp y mi chat para enviar tu pedido con el comprobante.";return}
  catch(e){if(e&&e.name==="AbortError"){if(W)W.close();return}}}
 openWA("https://wa.me/"+D.whatsapp+"?text="+encodeURIComponent(m));
 pm.style.color="var(--ok)";pm.textContent="Se abrió WhatsApp con tu pedido. Adjunta la captura de tu comprobante en el chat y envíalo."}
document.getElementById("ttl").textContent=D.title;draw();
function tab(n){document.getElementById("shop").className=n==1?"":"hid";document.getElementById("rep").className=n==2?"":"hid";document.getElementById("t1").className="tb"+(n==1?" on":"");document.getElementById("t2").className="tb"+(n==2?" on":"");document.getElementById("bar").style.display=(n==1&&total()[1])?"flex":"none"}
document.getElementById("rp").innerHTML='<option value="">Elige...</option>'+P.map(function(p){return '<option>'+esc(p.n)+'</option>'}).join("");
function withTO(p,ms){return Promise.race([p,new Promise(function(_,rj){setTimeout(function(){rj({message:"tiempo agotado"})},ms)})])}
function repDone(){["rn","rpf","rc","rd","rph"].forEach(function(i){document.getElementById(i).value=""});document.getElementById("rp").value="";
 var m=document.getElementById("rm");m.style.color="var(--ok)";m.textContent="✅ Reporte enviado. Te respondemos por WhatsApp."}
async function sendRep(){
 var g=function(i){return document.getElementById(i).value.trim()},m=document.getElementById("rm");
 m.style.color="var(--no)";
 if(!g("rp")||!g("rd")){m.textContent="Elige la plataforma y describe el problema.";return}
 var f=document.getElementById("rph").files[0];
 if(f&&f.type.indexOf("image/")!==0){m.textContent="La foto debe ser una imagen.";return}
